<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGALIS | الصفحة الأكاديمية - الباحث عبد اللطيف</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-dark: #0f172a;
            --primary-navy: #162447;
            --primary-blue: #1e3a8a;
            --accent-gold: #c5a66b;
            --accent-gold-dark: #b89552;
            --bg-light: #f1f5f9;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.8;
        }

        /* الواجهة العلوية وبطاقة الهوية البصرية */
        .hero-wrapper {
            background: linear-gradient(155deg, #273244 0%, #1c2842 45%, #162447 100%);
            color: #ffffff;
            padding: 50px 20px 75px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.22);
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .hero-wrapper::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.07), transparent 65%);
            pointer-events: none;
        }

        .brand-identity {
            max-width: 780px;
            margin: 0 auto 30px;
            position: relative;
            z-index: 1;
        }

        .scale-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 12px;
        }

        .scale-icon svg {
            width: 48px;
            height: 48px;
            stroke: var(--accent-gold);
            stroke-width: 1.7;
            fill: none;
        }

        .brand-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #f8fafc;
            margin-bottom: 8px;
        }

        .brand-subtitle-fr {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 22px;
        }

        .hero-divider {
            width: 80%;
            max-width: 600px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(197, 166, 107, 0.5), transparent);
            margin: 0 auto 24px;
        }

        .hero-intro h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .hero-services {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 6px;
        }

            font-size: 0.95rem;
            color: var(--accent-gold);
